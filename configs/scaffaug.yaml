GENERAL:
  seed: 1
  num_workers: 0
DATA:
  dataset_name: AID1798
  split_scheme: random_cv1
TRAIN:
  num_epochs: 150 # check if this is correct
  batch_size: 128
  warmup_percentage: 0.1
  peak_lr: 1e-3
  end_lr: 1e-4
  weight_decay: 1e-2
  early_stop: 80
AUGMENTATION:
  confidence_threshold: 0.7
  pseudo_label_freq: 3
  start_epoch: 20
MODEL:
  model_name: gcn